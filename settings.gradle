pluginManagement {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.fabricmc.net" }
        maven { url = "https://maven.architectury.dev" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.kikugie.dev/releases" }
        maven { url = "https://maven.kikugie.dev/snapshots" }
    }
}

buildscript {
    System.setProperty("rootDir", rootProject.projectDir.absolutePath.toString())
    Properties properties = new Properties()
    var path = java.nio.file.Path.of(System.getProperty("rootDir")).resolve("gradle.properties")
    properties.load(path.newInputStream())
}

plugins {
    id "dev.kikugie.stonecutter" version "$stonecutter_version"
}

stonecutter {
    shared {
        vers("1.20.1-forge", "1.20.1")
        vers("1.20.1-fabric", "1.20.1")
        vers("1.21.1-fabric", "1.21.1")
        vers("1.21.1-forge", "1.21.1")
        vers("1.21.1-neoforge", "1.21.1")
        vers("1.21.3-fabric", "1.21.3")
        vers("1.19.2-fabric", "1.19.2")
        vers("1.19.2-forge", "1.19.2")
        vers("1.18.2-fabric", "1.18.2")
        vers("1.18.2-forge", "1.18.2")
        vers("1.16.5-fabric", "1.16.5")
        vers("1.16.5-forge", "1.16.5")
        vcsVersion = "1.20.1-forge"
    }
    create rootProject
}
