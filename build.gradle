import net.minecraftforge.gradle.common.tasks.DownloadAssets
import net.minecraftforge.gradle.common.util.RunConfig
import org.embeddedt.embeddium.gradle.BlacksmithDownloader
import org.embeddedt.embeddium.gradle.DiscordNotifier
import org.embeddedt.embeddium.gradle.versioning.ProjectVersioner
import org.w3c.dom.Element

plugins {
    id("idea")
    id("net.minecraftforge.gradle") version("6.0.25")
    id("maven-publish")
    id("org.spongepowered.mixin") version("0.7.38")

    id("me.modmuss50.mod-publish-plugin") version("0.3.4")

    id("org.parchmentmc.librarian.forgegradle") version("1.2.0.7-dev-SNAPSHOT")

    id("embeddium-fabric-remapper")
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17.majorVersion
    targetCompatibility = JavaVersion.VERSION_17.majorVersion
    options.encoding = "UTF-8"
}

version = getModVersion()
group = maven_group
println("Embeddium: $version")

base {
    archivesName = archives_base_name
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
// java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def extraSourceSets = ["compat"]

sourceSets {
    create("gameTest") {
        java {
            compileClasspath += main.compileClasspath
            compileClasspath += main.output
        }
    }

    extraSourceSets.forEach {
        create(it) {
            java {
                compileClasspath += main.compileClasspath
                compileClasspath += main.output
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.tterrag.com/" }
    maven { url = "https://maven.blamejared.com" }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
    maven { url = "https://maven.covers1624.net/" }
}

jarJar.enable()

minecraft {
    if(rootProject.properties.containsKey("parchment_version")) {
        mappings("parchment", parchment_version)
    } else {
        mappings("official", minecraft_version)
    }
    copyIdeResources = true
    accessTransformer(file("src/main/resources/META-INF/accesstransformer.cfg"))
    runs {
        configureEach {
            workingDirectory(project.file("run"))

            property("forge.logging.console.level", "info")

            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")

            mods {
                create("embeddium") {
                    sources(sourceSets.main)
                    extraSourceSets.forEach {
                        sources(sourceSets[it])
                    }
                }
            }
        }

        def client = create("client") {
            jvmArgs.add("-javaagent:${BlacksmithDownloader.getBlacksmithJar(project).absolutePath}")
        }

        create("fastClient") {
            parent(client)
            jvmArgs.add("-javaagent:${BlacksmithDownloader.getBlacksmithJar(project).absolutePath}")
            jvmArgs.add("-XX:TieredStopAtLevel=1")
        }
    }
}

configurations {
    def runtimeOnlyNonPublishable = create("runtimeOnlyNonPublishable") {
        description = "Runtime only dependencies that are not published alongside the jar"
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeClasspath.extendsFrom(runtimeOnlyNonPublishable)
}

mixin {
    // MixinGradle Settings
    add(sourceSets.main, "embeddium-refmap.json")
    config("embeddium.mixins.json")
}

dependencies {
    minecraft("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // Mods
    compatCompileOnly(fg.deobf("curse.maven:codechickenlib-242818:${codechicken_fileid}"))
    compatCompileOnly(fg.deobf("curse.maven:immersiveengineering-231951:${ie_fileid}"))
    compatCompileOnly(fg.deobf("com.brandon3055.brandonscore:BrandonsCore:1.20.1-3.2.1.302:universal"))

    runtimeOnly(fg.deobf("curse.maven:modernfix-790626:5676014"))
    runtimeOnly(fg.deobf("curse.maven:radium-570017:5706069"))
    runtimeOnly(fg.deobf("curse.maven:immediatelyfast-686911:5838235"))

    // Fabric API
    compileOnly("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    compileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    annotationProcessor("net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5")

    compileOnly("io.github.llamalad7:mixinextras-common:0.3.5")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5")

    compileOnly("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")

    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.5")) {
        jarJar.ranged(it, "[0.3.5,)")
    }
}

tasks.processResources {
    inputs.property("version", version)

    filesMatching("META-INF/mods.toml") {
        expand("version" to version)
    }
}

tasks.withType(JavaCompile) {
    options.release = 17
}

tasks.named("downloadAssets", DownloadAssets) {
    // Try to work around asset download failures
    concurrentDownloads = 1
}


java {
    withSourcesJar()
}

tasks.named("jar", Jar).configure {
    archiveClassifier = "slim"
}

tasks.jarJar {
    from("COPYING", "COPYING.LESSER", "README.md")

    extraSourceSets.forEach {
        from(sourceSets[it].output.classesDirs)
        from(sourceSets[it].output.resourcesDir)
    }

    finalizedBy("reobfJarJar")

    archiveClassifier = ""
}

tasks.named("sourcesJar", Jar).configure {
    extraSourceSets.forEach {
        from(sourceSets[it].allJava)
    }
}

publishing {
    tasks.publish {
        dependsOn(tasks.build)
    }
    publications {
        create("mavenJava", MavenPublication) {
            artifact(tasks.named("jarJar"))
            artifact(tasks.named("sourcesJar"))
            fg.component(it)
        }
    }

    repositories {
        maven { url = "file://${System.getenv("local_maven")}" }
    }
}

tasks.create("publishSnapshotToDiscord") {
    outputs.upToDateWhen { false }
    doLast {
        DiscordNotifier.publishEmbeddiumJar(project, tasks.jarJar.get().archiveFile.get().asFile)
    }
    dependsOn("reobfJarJar")
}

def getModVersion() {
    return ProjectVersioner.computeVersion(project.projectDir, project.properties)
}