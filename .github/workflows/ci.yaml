# Used when a commit is pushed to the repository
# This makes use of caching for faster builds and uploads the resulting artifacts
name: ci
on: push

jobs:
  build:
    runs-on: ubuntu-large

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
      - name: Initialize caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-${{ runner.os }}-build-snapshot-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('settings.gradle') }}
          restore-keys: |
            release-${{ runner.os }}-build-snapshot-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Initialize Unimined caches
        uses: actions/cache@v4
        with:
          path: |
            **/.gradle/unimined
          key: unimined-v3-${{ runner.os }}-build-snapshot-${{ hashFiles('modern/build.gradle') }}-${{ hashFiles('settings.gradle.kts') }}
          restore-keys: |
            unimined-v3-${{ runner.os }}-build-snapshot-${{ hashFiles('modern/build.gradle') }}-
            unimined-v3-${{ runner.os }}-build-snapshot-
      - name: Build all packaged jars
        run: ./gradlew packageJar
      - name: Show checksums
        run: find build/libs -name \*.jar | sort | xargs sha256sum