name: Main Pipeline (Hash Comparison - Corrected)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync-build-release:
    name: Sync & Build (${{ matrix.branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: stonecutter
            do_release: true
          - branch: sarder-refactor
            do_release: false

    steps:
      - name: 1. Checkout repository to setup workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: 2. Get remote hash BEFORE sync
        id: get_before_hash
        run: |
          HASH=$(git rev-parse HEAD)
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: 3. Sync '${{ matrix.branch }}' from upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://git.taumc.org/embeddedt/celeritas.git"
          source_branch: ${{ matrix.branch }}
          destination_branch: ${{ matrix.branch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Get remote hash AFTER sync
        id: get_after_hash
        run: |
          git fetch origin ${{ matrix.branch }}
          HASH=$(git rev-parse origin/${{ matrix.branch }})
          echo "hash=${HASH}" >> $GITHUB_OUTPUT

      - name: 5. Compare hashes and decide to continue
        id: check_changes
        run: |
          echo "Branch: ${{ matrix.branch }}"
          echo "Before Hash: ${{ steps.get_before_hash.outputs.hash }}"
          echo "After Hash:  ${{ steps.get_after_hash.outputs.hash }}"
          if [ "${{ steps.get_before_hash.outputs.hash }}" == "${{ steps.get_after_hash.outputs.hash }}" ]; then
            echo "✅ No new commits. Skipping build and release."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New commits detected. Proceeding to build and release."
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      - name: 6. Checkout latest code for build
        if: steps.check_changes.outputs.continue == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}


      - name: Set up JDK
        if: steps.check_changes.outputs.continue == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "8, 17, 21"

      - name: Initialize Gradle caches
        if: steps.check_changes.outputs.continue == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.branch }}-

      - name: Build all packaged jars
        if: steps.check_changes.outputs.continue == 'true'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew -Ptarget_versions=<1.21.8> packageJar
          ./gradlew -Ptarget_versions=<1.21.1> packageJar
          ./gradlew -Ptarget_versions=<1.12.2> packageJar
          ./gradlew -Ptarget_versions=<1.7.10> packageJar
          ./gradlew -Ptarget_versions=<1.8.9> packageJar
          ./gradlew -Ptarget_versions=<1.2.5> packageJar
          echo "Build process finished."

      - name: Create GitHub Release
        if: steps.check_changes.outputs.continue == 'true' && matrix.do_release == true
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ matrix.branch }}-snapshot-$(date +%Y%m%d)-${{ github.run_number }}
          release_name: "Automated Snapshot for ${{ matrix.branch }} ${{ github.run_number }}"
          body: |
            Automated release triggered by new commits on the **${{ matrix.branch }}** branch.
            - **Last Commit:** `${{ steps.get_after_hash.outputs.hash }}`
            
            These are development builds and may be unstable.
          files: build/libs/*.jar
          prerelease: true