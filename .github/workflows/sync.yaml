name: Stateful Build Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  check:
    name: Check ${{ matrix.branch }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.checker.outputs.should_run }}
    strategy:
      matrix:
        branch: [stonecutter]
    steps:
      - name: Checkout 'Sync-Action' branch to read previous hash
        uses: actions/checkout@v4
        with:
          ref: Sync-Action
      - name: Clone upstream repository (celeritas)
        run: git clone https://git.taumc.org/embeddedt/celeritas.git
      - name: Get latest commit hash from upstream branch
        id: get_latest
        working-directory: ./celeritas
        run: |
          git checkout ${{ matrix.branch }}
          git pull
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get previous commit hash from storage file
        id: get_previous
        run: |
          echo "commit_hash=$(cat ./latest_commit_${{ matrix.branch }} || echo 'first-run')" >> $GITHUB_OUTPUT
      - name: Compare hashes to see if an update is needed
        id: checker
        run: |
          echo "Branch: ${{ matrix.branch }}"
          echo "Previous Hash: ${{ steps.get_previous.outputs.commit_hash }}"
          echo "Latest Hash:   ${{ steps.get_latest.outputs.commit_hash }}"
          if [[ "${{ steps.get_latest.outputs.commit_hash }}" == "${{ steps.get_previous.outputs.commit_hash }}" ]]; then
            echo "✅ No new commits."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New commits detected!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  prepare_build_matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    needs: check
    outputs:
      matrix: ${{ steps.generate_matrix.outputs.matrix }}
    steps:
      - name: Generate matrix for changed branches
        id: generate_matrix
        run: |
          JSON_MATRIX=$(echo '${{ toJSON(needs.check.outputs) }}' | jq '{include: [to_entries[] | select(.value.should_run == "true") | {branch: .key}]}')
          echo "matrix=$JSON_MATRIX" >> $GITHUB_OUTPUT

  build-and-release:
    name: Build & Release ${{ matrix.branch }}
    runs-on: ubuntu-latest
    needs: prepare_build_matrix
    if: needs.prepare_build_matrix.outputs.matrix != '{"include":[]}'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_build_matrix.outputs.matrix) }}
    steps:
      - name: Checkout 'Sync-Action' branch for state update
        uses: actions/checkout@v4
        with:
          ref: Sync-Action
      - name: Clone upstream repository (celeritas) for build
        run: git clone https://git.taumc.org/embeddedt/celeritas.git
      - name: Setup branch and get hashes
        id: setup
        working-directory: ./celeritas
        run: |
          git checkout ${{ matrix.branch }}
          git pull
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "previous_hash=$(cat ../latest_commit_${{ matrix.branch }} || git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
      - name: Build all packaged jars
        working-directory: ./celeritas
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew -Ptarget_versions=1.21.8 packageJar
          ./gradlew -Ptarget_versions=1.21.1 packageJar
          ./gradlew -Ptarget_versions=1.12.2 packageJar
          ./gradlew -Ptarget_versions=1.7.10 packageJar
          ./gradlew -Ptarget_versions=1.8.9 packageJar
          ./gradlew -Ptarget_versions=1.2.5 packageJar
      - name: Create release body with changelog
        id: changelog
        working-directory: ./celeritas
        run: |
          echo "Automated release triggered by new commits on the **${{ matrix.branch }}** branch." > ../body.txt
          echo "Built from commit: https://git.taumc.org/embeddedt/celeritas/commit/${{ steps.setup.outputs.commit_hash }}" >> ../body.txt
          echo "" >> ../body.txt
          echo "### Commits since last release:" >> ../body.txt
          git log --pretty=format:"* %h - %s (%an)" ${{ steps.setup.outputs.previous_hash }}..${{ steps.setup.outputs.commit_hash }} >> ../body.txt
      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ matrix.branch }}-snapshot-$(date +%Y%m%d)-${{ github.run_number }}
          name: "Automated Snapshot for ${{ matrix.branch }} on $(date +%Y-%m-%d)"
          bodyFile: "body.txt"
          artifacts: "celeritas/build/libs/*.jar"
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update hash storage file
        run: echo "${{ steps.setup.outputs.commit_hash }}" > ./latest_commit_${{ matrix.branch }}
      - name: Commit and push hash file update
        uses: EndBug/add-and-commit@v9
        with:
          add: 'latest_commit_${{ matrix.branch }}'
          message: 'CI: Update latest commit hash for ${{ matrix.branch }}'
          push: true