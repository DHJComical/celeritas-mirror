name: Stateful Build Pipeline (Final Production Version)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build-and-release:
    name: Sync, Build & Release Stonecutter
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 'Sync-Action' branch for state management
        uses: actions/checkout@v4
        with:
          ref: Sync-Action

      - name: Clone upstream 'stonecutter' branch into a sub-directory
        run: git clone --branch stonecutter https://git.taumc.org/embeddedt/celeritas.git ./celeritas

      - name: Get latest commit hash from upstream
        id: get_latest
        working-directory: ./celeritas
        run: |
          git pull
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Get previous commit hash from storage file
        id: get_previous
        run: |
          if [[ -f ./latest_commit_stonecutter ]]; then
            echo "commit_hash=$(cat ./latest_commit_stonecutter)" >> $GITHUB_OUTPUT
          else
            echo "commit_hash=first-run" >> $GITHUB_OUTPUT
          fi

      - name: Compare hashes and decide whether to run
        id: checker
        run: |
          echo "Previous Hash: ${{ steps.get_previous.outputs.commit_hash }}"
          echo "Latest Hash:   ${{ steps.get_latest.outputs.commit_hash }}"
          if [[ "${{ steps.get_latest.outputs.commit_hash }}" == "${{ steps.get_previous.outputs.commit_hash }}" ]]; then
            echo "✅ No new commits. Halting workflow."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New commits detected! Proceeding to build and release."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        if: steps.checker.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21

      - name: Build all packaged jars
        if: steps.checker.outputs.should_run == 'true'
        working-directory: ./celeritas
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew -Ptarget_versions=1.21.8 packageJar
          ./gradlew -Ptarget_versions=1.21.1 packageJar
          ./gradlew -Ptarget_versions=1.12.2 packageJar
          ./gradlew -Ptarget_versions=1.7.10 packageJar
          ./gradlew -Ptarget_versions=1.8.9 packageJar
          ./gradlew -Ptarget_versions=1.2.5 packageJar

      - name: Create release body with changelog
        if: steps.checker.outputs.should_run == 'true'
        working-directory: ./celeritas
        run: |
          START_COMMIT="${{ steps.get_previous.outputs.commit_hash }}"
          if [[ "$START_COMMIT" == "first-run" ]]; then
            START_COMMIT=$(git rev-parse HEAD~1)
          fi
          echo "Automated release triggered by new commits on the **stonecutter** branch." > ../body.txt
          echo "Built from commit: https://git.taumc.org/embeddedt/celeritas/commit/${{ steps.get_latest.outputs.commit_hash }}" >> ../body.txt
          echo "" >> ../body.txt
          echo "### Commits since last release:" >> ../body.txt
          git log --pretty=format:"* %h - %s (%an)" $START_COMMIT..${{ steps.get_latest.outputs.commit_hash }} >> ../body.txt

      - name: Create GitHub Release
        if: steps.checker.outputs.should_run == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: stonecutter-snapshot-$(date +%Y%m%d)-${{ github.run_number }}
          name: "Automated Snapshot for stonecutter on $(date +%Y-%m-%d)"
          bodyFile: "body.txt"
          artifacts: "celeritas/build/libs/*.jar" # artifacts 路径指向子目录
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hash storage file
        if: steps.checker.outputs.should_run == 'true'
        run: echo "${{ steps.get_latest.outputs.commit_hash }}" > ./latest_commit_stonecutter

      - name: Commit and push hash file update to 'Sync-Action' branch
        if: steps.checker.outputs.should_run == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add ./latest_commit_stonecutter
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit. The hash file is already up-to-date."
          else
            echo "Changes detected. Committing and pushing to Sync-Action branch..."
            git commit -m "CI: Update latest commit hash for stonecutter"
            git push origin Sync-Action
          fi