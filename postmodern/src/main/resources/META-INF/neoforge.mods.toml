modLoader = "javafml"
loaderVersion = "*"
license = "$license"
issueTrackerURL = "$issue_tracker_url"

[[mods]]
logoFile="icon.png"
modId = "celeritas"
version = "$mod_version"
displayName = "$mod_display_name"
authors = '${String.join(", ",authors)}'
credits = '${String.join(", ",contributors)}'
displayURL = "$homepage_url"
description = "$mod_description"

[[mixins]]
config = "embeddium.mixins.json"